# The user's catalog wiring. If Fusion later exposes its own catalog endpoint, only this
# file changes; no test code does.

spark.sql.extensions                                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                              olake_iceberg
spark.sql.catalog.olake_iceberg                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.olake_iceberg.catalog-impl          org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.olake_iceberg.uri                   jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.olake_iceberg.jdbc.user             iceberg
spark.sql.catalog.olake_iceberg.jdbc.password         password
spark.sql.catalog.olake_iceberg.jdbc.schema-version   V1
spark.sql.catalog.olake_iceberg.warehouse             s3://warehouse/olake_iceberg/
spark.sql.catalog.olake_iceberg.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.olake_iceberg.s3.endpoint           http://minio:9000
spark.sql.catalog.olake_iceberg.s3.path-style-access  true
spark.sql.catalog.olake_iceberg.s3.access-key-id      admin
spark.sql.catalog.olake_iceberg.s3.secret-access-key  password
spark.sql.catalog.olake_iceberg.client.region         us-east-1
# Every read must see the latest commit, including Fusion's.
spark.sql.catalog.olake_iceberg.cache-enabled         false
spark.connect.grpc.binding.port                       15002
