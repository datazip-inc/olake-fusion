# Test stack: Fusion (AMS) + catalog Postgres + MinIO + Spark optimizer on Kind, plus what a
# user brings: a source Postgres for OLake and a Spark Connect query engine. Same topology as
# local-test/docker-compose.yml, isolated from it: own container names, subnet, Kind cluster,
# volumes and host ports.
#
# scripts/run.sh tags the images under test as fusion:test and fusion-spark:test, and
# scripts/stack.sh renders ../build/config.yaml (shipped config + fusion-config.overlay.yaml)
# before starting.

name: fusion-test

services:
  fusion:
    image: fusion:test
    container_name: fusion-test-ams
    depends_on:
      postgres:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
      kind-setup:
        condition: service_completed_successfully
      spark-copy:
        condition: service_completed_successfully
    networks:
      fusion-test-net:
        ipv4_address: 10.210.40.10
    ports:
      - "${TEST_FUSION_PORT:-11630}:1630"
    environment:
      JVM_XMS: "1024"
      JVM_XMX: "2048"
      KUBECONFIG: /root/.kube/config
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      LOG_DIR: /mnt/amoro-logs/compaction
    volumes:
      - ../build/config.yaml:/usr/local/amoro/conf/config.yaml:ro
      - kind-kubeconfig:/root/.kube:ro
      - spark-home:/opt/spark:ro
      - ${TEST_LOG_DIR:-/tmp/fusion-test-logs}:/mnt/amoro-logs
    command: ["/entrypoint.sh", "ams"]

  fusion-init:
    image: curlimages/curl:8.10.1
    container_name: fusion-test-init
    depends_on:
      fusion:
        condition: service_started
      kind-load-image:
        condition: service_completed_successfully
    networks:
      fusion-test-net:
    environment:
      API: http://fusion:1630/api/ams/v1
      OPTIMIZER_PARALLELISM: ${TEST_OPTIMIZER_PARALLELISM:-2}
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  postgres:
    image: postgres:15
    container_name: fusion-test-postgres
    networks:
      fusion-test-net:
        ipv4_address: 10.210.40.20
    ports:
      - "${TEST_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iceberg
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg"]
      interval: 3s
      timeout: 10s
      retries: 20
    command: postgres -c max_connections=300

  # The user's source database that OLake replicates from (CDC).
  source-postgres:
    image: postgres:15
    container_name: fusion-test-source
    networks:
      fusion-test-net:
    ports:
      - "${TEST_SOURCE_PORT:-25432}:5432"
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: password
      POSTGRES_DB: source
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "source", "-d", "source"]
      interval: 3s
      timeout: 10s
      retries: 20
    command: postgres -c wal_level=logical -c max_replication_slots=20 -c max_wal_senders=20

  # The user's query engine.
  spark-connect:
    image: fusion-spark-connect:test
    build:
      context: ../..
      dockerfile: integration-tests/docker/spark-connect/Dockerfile
    container_name: fusion-test-spark-connect
    depends_on:
      postgres:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    networks:
      fusion-test-net:
    ports:
      - "${TEST_SPARK_CONNECT_PORT:-15002}:15002"
    environment:
      AWS_REGION: us-east-1

  minio:
    image: olakego/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: fusion-test-minio
    networks:
      fusion-test-net:
        ipv4_address: 10.210.40.5
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports:
      - "${TEST_MINIO_PORT:-19000}:9000"
    command: ["server", "/data"]

  mc:
    image: olakego/mc:RELEASE.2025-04-03T17-07-56Z
    container_name: fusion-test-mc
    depends_on:
      - minio
    networks:
      fusion-test-net:
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 admin password; do sleep 1; done
        /usr/bin/mc mb minio/warehouse --ignore-existing
        echo "MinIO bucket 'warehouse' is ready."

  kind-setup:
    image: docker:27-cli
    container_name: fusion-test-kind-setup
    networks:
      fusion-test-net:
    environment:
      TEST_LOG_DIR: ${TEST_LOG_DIR:-/tmp/fusion-test-logs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kind-kubeconfig:/output
      - ./kind-config.yaml:/kind-config.yaml:ro
      - ./spark-rbac.yaml:/spark-rbac.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        sed "s|AMORO_LOG_PLACEHOLDER|$$TEST_LOG_DIR|g" /kind-config.yaml > /tmp/kind-config.yaml

        case "$$(uname -m)" in
          x86_64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "unsupported arch $$(uname -m)"; exit 1 ;;
        esac
        apk add --no-cache curl >/dev/null 2>&1
        curl -sLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-$$ARCH
        chmod +x /usr/local/bin/kind

        if kind get clusters 2>/dev/null | grep -q '^fusion-test-cluster$$'; then
          echo "Kind cluster fusion-test-cluster exists, reusing it."
        else
          kind create cluster --config /tmp/kind-config.yaml --wait 180s
        fi

        for n in $$(docker ps --filter "label=io.x-k8s.kind.cluster=fusion-test-cluster" --format "{{.Names}}"); do
          docker network connect fusion-test-net "$$n" 2>/dev/null || true
        done

        docker exec -i fusion-test-cluster-control-plane \
          kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f - < /spark-rbac.yaml

        kind get kubeconfig --name fusion-test-cluster \
          | sed 's|server: .*|server: https://fusion-test-cluster-control-plane:6443|' > /output/config
        chmod 644 /output/config
        echo "Kind setup complete."

  kind-load-image:
    image: docker:27-cli
    container_name: fusion-test-kind-load-image
    depends_on:
      kind-setup:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:size=4G
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        docker save fusion-spark:test -o /tmp/optimizer.tar
        for n in $$(docker ps --filter "label=io.x-k8s.kind.cluster=fusion-test-cluster" --format "{{.Names}}"); do
          echo "Importing fusion-spark:test into $$n"
          docker exec -i "$$n" ctr --namespace=k8s.io images import - < /tmp/optimizer.tar
        done
        rm -f /tmp/optimizer.tar

  spark-copy:
    image: fusion-spark:test
    container_name: fusion-test-spark-copy
    user: root
    entrypoint: ["/bin/sh", "-c", "cp -a /opt/spark/. /spark-vol/ && echo 'Spark copied.'"]
    volumes:
      - spark-home:/spark-vol

networks:
  fusion-test-net:
    driver: bridge
    name: fusion-test-net
    ipam:
      config:
        - subnet: 10.210.40.0/24

volumes:
  kind-kubeconfig:
  spark-home:
