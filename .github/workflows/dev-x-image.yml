# Publishes the dev images on every push to feat/db-source-of-truth-release-branch.
#
# Because "dev-x" does not match vX.X.X, docker-images.yml tags both images with
# :dev-x and :dev-x-latest, i.e. olakego/fusion and olakego/fusion-spark.

name: Fusion Dev Image (dev-x)

on:
  push:
    branches:
      - feat/db-source-of-truth-release-branch

jobs:
  build_fusion_dev:
    name: Build and Publish Fusion Dev Images
    uses: ./.github/workflows/docker-images.yml
    with:
      tag: dev-x
    secrets: inherit
