# End-to-end tests for merges to master: builds the Fusion and Spark optimizer
# images from this commit, starts integration-tests/docker (Fusion, Postgres,
# MinIO, Spark on Kind), and runs integration-tests/ with Maven failsafe.

name: Integration Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Trigger policy is still open. Current default: every PR into master, plus manual runs.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SPARK_VERSION: 3.5.8
      SCALA_VERSION: 2.13.18
      IT_LOG_DIR: /tmp/fusion-it-logs
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve versions
        id: versions
        run: |
          AMORO_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout | tail -1 | tr -d '\r')
          echo "AMORO_VERSION=$AMORO_VERSION" >> "$GITHUB_OUTPUT"
          echo "SPARK_MAJOR=$(echo "$SPARK_VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "SCALA_BINARY=$(echo "$SCALA_VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Build Fusion distribution
        run: ./mvnw clean package -pl dist -am -DskipTests -B -ntp -Psupport-all-formats -Pno-extended-disk-storage -Pno-plugin-bin

      - name: Build Spark optimizer job
        run: >-
          ./mvnw package -pl amoro-optimizer/amoro-optimizer-spark -am -DskipTests -B -ntp
          -Dspark.version=${SPARK_VERSION}
          -Dscala.version=${SCALA_VERSION}
          -Dscala.binary.version=${{ steps.versions.outputs.SCALA_BINARY }}

      - name: Build images
        run: |
          docker build -f docker/amoro/Dockerfile -t fusion:it .
          docker build -f docker/optimizer-spark/Dockerfile -t fusion-spark:it \
            --build-arg SPARK_VERSION=${SPARK_VERSION} \
            --build-arg SPARK_JAVA_TAG=${SPARK_VERSION}-java17 \
            --build-arg OPTIMIZER_JOB=amoro-optimizer/amoro-optimizer-spark/target/amoro-optimizer-spark-${{ steps.versions.outputs.SPARK_MAJOR }}_${{ steps.versions.outputs.SCALA_BINARY }}-${{ steps.versions.outputs.AMORO_VERSION }}-jar-with-dependencies.jar \
            .

      - name: Start stack
        run: integration-tests/scripts/stack-up.sh

      - name: Run integration tests
        run: ./mvnw verify -Pintegration-tests -pl integration-tests -B -ntp

      - name: Collect logs
        if: always()
        run: integration-tests/scripts/collect-logs.sh it-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            it-logs
            integration-tests/target/failsafe-reports
          retention-days: 7

      - name: Stop stack
        if: always()
        run: integration-tests/scripts/stack-down.sh
