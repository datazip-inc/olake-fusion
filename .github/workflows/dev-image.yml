# Publishes the dev images on every push to feat/remove-partition-selection-logic.
#
# Because "dev-badal" does not match vX.X.X, docker-images.yml tags both images with
# :dev-badal and :dev-badal-latest:
# - olakego/fusion:dev-badal, olakego/fusion:dev-badal-latest
# - olakego/fusion-spark:dev-badal, olakego/fusion-spark:dev-badal-latest

name: Fusion Dev Image

on:
  push:
    branches:
      - feat/remove-partition-selection-logic-dev

jobs:
  build_fusion_dev:
    name: Build and Publish Fusion Dev Image
    uses: ./.github/workflows/docker-images.yml
    with:
      tag: dev-badal
    secrets: inherit
